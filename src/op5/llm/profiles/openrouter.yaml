# ─────────────────────────────────────────────────────────────────────────────
# OpenRouter Judge Profile — OpenRouter
# Provider: OpenRouter.ai (OpenAI-compatible /chat/completions endpoint)
#
# Env: OPENROUTER_API_KEY must be set in .env
# Models: tried in order until one succeeds
#   1. nvidia/nemotron-3-ultra-550b-a55b:free  (GPQA 86.7%, 1M ctx)
#   2. deepseek/deepseek-chat-v3:free           (strong reasoning, free)
#   3. openrouter/free                          (auto-router, fallback)
# ─────────────────────────────────────────────────────────────────────────────

base_url: https://openrouter.ai/api/v1
api_key: ${OPENROUTER_API_KEY}
api_type: openai

models:
  - nvidia/nemotron-3-ultra-550b-a55b:free
  - deepseek/deepseek-chat-v3:free
  - openrouter/free

timeout: 60
temperature: 0.1
max_tokens: 800
label: OpenRouter-Nemotron

# OpenRouter-specific headers
http_referer: https://github.com/op5-llm
x_title: OP5-LLM-Judge
