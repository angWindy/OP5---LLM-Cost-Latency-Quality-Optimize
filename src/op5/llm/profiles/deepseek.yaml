# ─────────────────────────────────────────────────────────────────────────────
# DeepSeek Judge Profile — DeepSeek native API
# Provider: api.deepseek.com (OpenAI-compatible /chat/completions endpoint)
#
# Env: DEEPSEEK_API_KEY must be set in .env
# Models: tried in order until one succeeds
#   1. deepseek-chat       (alias for DeepSeek-V3.2-Exp; cheap, fast, 64K ctx)
#   2. deepseek-reasoner   (R1-style reasoning; slower, more expensive)
#
# Pricing (per 1M tokens, as of Sep 2026):
#   - deepseek-chat:       ~$0.27 input / $1.10 output
#   - deepseek-reasoner:   ~$0.55 input / $2.19 output
# Off-peak discount (16:30-00:30 UTC) halves the price.
# ─────────────────────────────────────────────────────────────────────────────

base_url: https://api.deepseek.com/v1
api_key: ${DEEPSEEK_API_KEY}
api_type: openai

models:
  - deepseek-chat
  - deepseek-reasoner

timeout: 60
temperature: 0.1
max_tokens: 800
label: DeepSeek-V3
