[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "op5"
version = "0.1.0"
description = "LLM Cost, Latency & Quality Optimization"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4.0",
]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "httpx>=0.27",
]
ui = [
    "streamlit>=1.30",
    "httpx>=0.27",
]
ocr = [
    "paddleocr>=2.7",
    "paddlepaddle==2.6.0",
    "pytesseract>=0.3.10",
    "easyocr>=1.7",
]
rag = [
    "sentence-transformers>=2.7",
    "onnxruntime>=1.17",
    "rank-bm25>=0.2",
    "chromadb-client>=0.4",
]
all = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "streamlit>=1.30",
    "httpx>=0.27",
    "paddleocr>=2.7",
    "paddlepaddle==2.6.0",
    "pytesseract>=0.3.10",
    "easyocr>=1.7",
    "sentence-transformers>=2.7",
    "onnxruntime>=1.17",
    "rank-bm25>=0.2",
    "chromadb-client>=0.4",
]
